# ESPEJO de pruebas (mismo VPS, recursos ya disponibles — decision de David).
# Apagado por defecto; se enciende solo para ensayar:
#   sudo -u i docker compose -f docker-compose.staging.yml -p staging up -d
#   sudo -u i docker compose -f docker-compose.staging.yml -p staging down
# SIEMPRE en modo simulado: jamas gasta deposito.
services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2
    env_file: .env
    environment:
      STAGING_MODE: "true"
      MOCK_AGENTS: "true"
      ALLOWED_HOSTS: "stagings.xyztserver.com,staging.xyztserver.com,localhost,127.0.0.1"
    volumes: [ "./media-staging:/app/media" ]
    depends_on: [ db, redis ]
    ports: [ "127.0.0.1:8081:8000" ]
  worker:
    build: .
    command: celery -A config worker -l info --concurrency 1
    env_file: .env
    environment: { STAGING_MODE: "true", MOCK_AGENTS: "true" }
    volumes: [ "./media-staging:/app/media" ]
    depends_on: [ db, redis ]
  beat:
    build: .
    command: celery -A config beat -l info
    env_file: .env
    environment: { STAGING_MODE: "true", MOCK_AGENTS: "true" }
    depends_on: [ redis ]
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [ "pgdata_staging:/var/lib/postgresql/data" ]
  redis:
    image: redis:7-alpine
volumes:
  pgdata_staging:
