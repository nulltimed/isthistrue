# El portero de la discoteca: cada push corre el robot de tests en maquinas de GitHub.
# Verde = puedes desplegar al espejo. Rojo = ni lo toques y mira el enlace del fallo.
name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: isthistrue
          POSTGRES_USER: isthistrue
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'true'
      SECRET_KEY: ci-secret
      POSTGRES_DB: isthistrue
      POSTGRES_USER: isthistrue
      POSTGRES_PASSWORD: ci
      POSTGRES_HOST: 127.0.0.1
      MOCK_AGENTS: 'true'
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client gettext
      - run: pip install -r requirements.txt
      - run: PGPASSWORD=ci psql -h 127.0.0.1 -U isthistrue -d isthistrue -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - run: python manage.py makemigrations accounts analysis wiki forum panel --noinput
      - run: python manage.py migrate --noinput
      # 4.4-A: sin el catalogo compilado, la web sale en espanol aunque
      # el .po este en el repositorio. Los tests del ingles lo exigen.
      - run: python manage.py compilemessages
      - run: python manage.py test tests --settings=tests.settings_test -v 2
