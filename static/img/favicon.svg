<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="lampglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4e8c8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#e8d9a8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e8d9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.42" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#fdf8e7"/>
      <stop offset="0.7" stop-color="#f2e5bd"/>
      <stop offset="1" stop-color="#e4d29a"/>
    </radialGradient>
  </defs>
  <!-- la oscuridad -->
  <rect width="64" height="64" fill="#0d0d0d"/>
  <!-- el resplandor de la lente iluminando la oscuridad -->
  <circle cx="38" cy="26" r="34" fill="url(#lampglow)"/>
  <!-- mango en sombra, bordes rozados por la luz -->
  <line x1="27.4" y1="36.6" x2="9" y2="55" stroke="#e8dfc2" stroke-width="10" stroke-linecap="round"/>
  <line x1="27.4" y1="36.6" x2="9" y2="55" stroke="#141414" stroke-width="6.5" stroke-linecap="round"/>
  <!-- la lente: la fuente de luz -->
  <circle cx="38" cy="26" r="15" fill="url(#lens)" stroke="#fdf8e7" stroke-width="2.6"/>
  <!-- brillo del cristal -->
  <circle cx="33" cy="21" r="3.4" fill="#ffffff" opacity="0.85"/>
</svg>