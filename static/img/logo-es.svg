<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 56" width="340" height="56" role="img" aria-label="esestocierto?">
  <!-- 5.0-B (diseño de David): letra de maquina de escribir; "esesto" blanco con
       contorno negro; "cierto?" negro con contorno blanco. -->
  <text x="8" y="40" font-family="'Courier New', Courier, monospace" font-weight="bold"
        font-size="38" letter-spacing="0" style="paint-order: stroke fill">
    <tspan fill="#ffffff" stroke="#000000" stroke-width="2.6">esesto</tspan><tspan fill="#000000" stroke="#ffffff" stroke-width="2.6">cierto?</tspan>
  </text>
</svg>
