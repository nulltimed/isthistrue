# Nginx del HOST (el portero): proxy de los 3 subdominios al stack en 127.0.0.1:8090
# certbot --nginx -d isthistrue.xyztserver.com -d escierto.xyztserver.com -d wikitrue.xyztserver.com
map $host $backend { default http://127.0.0.1:8090; }

server {
    listen 80;
    server_name isthistrue.xyztserver.com escierto.xyztserver.com wikitrue.xyztserver.com;
    location / {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / HTMX streaming (Fase 2):
        proxy_buffering off;
        proxy_read_timeout 3600;
    }
    # Pagina de Full Panic (estatica, tipografia quemada):
    error_page 502 503 /panic.html;
    location = /panic.html { root /var/www/isthistrue-panic; internal; }
}


# --- ESPEJO DE PRUEBAS (staging) ---
# DNS: cuarto registro A "staging" -> IP del VPS. Luego: certbot --nginx -d stagings.xyztserver.com
# Capa 1 de acceso: invitados logueados (la app la gestiona desde el panel de David).
# Capa 2 opcional (basic auth): sudo htpasswd -c /etc/nginx/.htpasswd-staging d
server {
    listen 80;
    server_name stagings.xyztserver.com staging.xyztserver.com;  # alias: el registro A real hoy es "staging" (ver informe 2026-08-05)
    # auth_basic "Espejo de pruebas";                       # descomentar para capa 2
    # auth_basic_user_file /etc/nginx/.htpasswd-staging;    # descomentar para capa 2
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
