{% extends 'base.html' %}{% load i18n %}
{% block content %}
<div class="auth-card">
  <h1>{% trans "Contraseña nueva" %}</h1>
  {% if validlink %}
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="wide">{% trans "Guardar contraseña" %}</button></form>
  {% else %}
  <p>{% trans "Este enlace ya no es válido (caducó o ya se usó)." %}
     <a href="{% url 'password_reset' %}">{% trans "Pide uno nuevo" %}</a>.</p>
  {% endif %}
</div>
{% endblock %}
