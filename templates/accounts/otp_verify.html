{% extends 'base.html' %}{% load i18n %}
{% block content %}
<div class="auth-card">
  <h1>{% trans "Un paso más" %}</h1>
  <p class="hint">{% blocktrans %}Hola {{ username }}: escribe el código de tu app de verificación.{% endblocktrans %}</p>
  <form method="post">{% csrf_token %}
    <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="8" required autofocus>
    <button class="wide">{% trans "Entrar" %}</button></form>
</div>
{% endblock %}
