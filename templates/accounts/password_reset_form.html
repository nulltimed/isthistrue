{% extends 'base.html' %}{% load i18n %}
{% block content %}
<div class="auth-card">
  <h1>{% trans "Recuperar contraseña" %}</h1>
  <p class="hint">{% trans "Escribe el email de tu cuenta y te enviaremos un enlace para poner una contraseña nueva." %}</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="wide">{% trans "Enviarme el enlace" %}</button></form>
</div>
{% endblock %}
